name: Deploy (gated apply)

# G0 scaffold. On main: gated terraform apply via OIDC, then hand off to CodePipeline
# for per-service build -> scan -> ECR -> ECS -> post-deploy smoke -> rollback.
# Lane owner: Meron (Platform + delivery).

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: prod          # protected environment -> required reviewer gate
    permissions:
      id-token: write          # OIDC -> devops-g1-ci-deploy
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
