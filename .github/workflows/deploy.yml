name: Deploy

# Lane owner: Meron (Platform + delivery).
#
#   main -> gated terraform apply -> per-service build/push (SHA + digest)
#        -> ECS deploy BY DIGEST -> post-deploy smoke -> rollback on failure
#
# Artifact identity: images are tagged with the commit SHA and deployed by
# immutable digest. No `latest` anywhere. /version reports both at runtime, and
# the smoke test asserts the SHA it gets back is the SHA that was built.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy
        required: true
        default: pos
        type: choice
        options: [web, pos, payments, commission]

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false   # never interrupt an in-flight deploy

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "240462142849"
  TF_VERSION: "1.16.1"
  CLUSTER: devops-g1

jobs:
  # ---------------------------------------------------------------------------
  # Gated infrastructure apply
  # ---------------------------------------------------------------------------
  apply:
    runs-on: ubuntu-latest
    environment: prod          # protected environment -> required reviewer
    permissions:
      id-token: write
      contents: read
    outputs:
      services: ${{ steps.filter.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::240462142849:role/devops-g1-ci-deploy
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-apply-${{ github.run_id }}

      - name: terraform init
        run: terraform -chdir=infra init -input=false

      # Re-plan on this commit and apply that plan, rather than a bare
      # `apply -auto-approve`: the applied change is the reviewed change.
      - name: terraform plan
        run: terraform -chdir=infra plan -input=false -no-color -out=tfplan

      - name: terraform apply
        run: terraform -chdir=infra apply -input=false -no-color tfplan

      - name: Naming + tag audit (gate)
        run: ./infra/scripts/audit.sh

      - name: Which services changed
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'services=["${{ inputs.service }}"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD~1 HEAD || echo "")
          services='[]'
          shared=false
          echo "$changed" | grep -q '^services/_shared/' && shared=true
          for s in web pos payments commission; do
            if $shared || echo "$changed" | grep -q "^services/$s/"; then
              services=$(echo "$services" | jq -c --arg s "$s" '. + [$s]')
            fi
          done
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "deploying: $services"

  # ---------------------------------------------------------------------------
  # Build -> push -> deploy by digest -> smoke -> rollback
  # ---------------------------------------------------------------------------
  release:
    needs: apply
    if: needs.apply.outputs.services != '[]'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.apply.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::240462142849:role/devops-g1-ci-deploy
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-release-${{ github.run_id }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # Capture what is running NOW, so rollback has somewhere to go back to.
      - name: Record current task definition
        id: current
        run: |
          current=$(aws ecs describe-services \
            --cluster "$CLUSTER" --services "devops-g1-${{ matrix.service }}" \
            --query 'services[0].taskDefinition' --output text)
          echo "task_definition=$current" >> "$GITHUB_OUTPUT"
          echo "current: $current"

      - name: Build and push (tagged with the commit SHA)
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          REPO="$REGISTRY/devops-g1/${{ matrix.service }}"
          docker build --platform linux/amd64 --provenance=false \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            --build-arg SERVICE_NAME=${{ matrix.service }} \
            -t "$REPO:${{ github.sha }}" \
            services/_shared/docker
          docker push "$REPO:${{ github.sha }}"

          # Resolve the immutable digest -- what we actually deploy.
          digest=$(aws ecr describe-images \
            --repository-name "devops-g1/${{ matrix.service }}" \
            --image-ids imageTag=${{ github.sha }} \
            --query 'imageDetails[0].imageDigest' --output text)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=$REPO@$digest" >> "$GITHUB_OUTPUT"
          echo "deploying $REPO@$digest"

      - name: Wait for ECR enhanced scan
        run: |
          for i in $(seq 1 30); do
            status=$(aws ecr describe-image-scan-findings \
              --repository-name "devops-g1/${{ matrix.service }}" \
              --image-id imageDigest=${{ steps.build.outputs.digest }} \
              --query 'imageScanStatus.status' --output text 2>/dev/null || echo PENDING)
            [ "$status" = "COMPLETE" ] && break
            [ "$status" = "FAILED" ] && { echo "::warning::scan failed"; break; }
            sleep 10
          done
          counts=$(aws ecr describe-image-scan-findings \
            --repository-name "devops-g1/${{ matrix.service }}" \
            --image-id imageDigest=${{ steps.build.outputs.digest }} \
            --query 'imageScanFindingsSummary.findingSeverityCounts' --output json 2>/dev/null || echo '{}')
          echo "findings: $counts"
          crit=$(echo "$counts" | jq -r '.CRITICAL // 0')
          if [ "$crit" -gt 0 ]; then
            echo "::error::$crit CRITICAL finding(s) in the image"; exit 1
          fi

      # Register a new revision pointing at the digest, leaving the rest of the
      # task definition (sidecar, roles, limits) exactly as Terraform defined it.
      - name: Register task definition with the new digest
        id: register
        run: |
          aws ecs describe-task-definition \
            --task-definition "devops-g1-${{ matrix.service }}" \
            --query 'taskDefinition' --output json > td.json

          jq --arg img "${{ steps.build.outputs.image }}" \
             --arg svc "${{ matrix.service }}" '
            .containerDefinitions = (
              .containerDefinitions | map(if .name == $svc then .image = $img else . end)
            )
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' td.json > new-td.json

          arn=$(aws ecs register-task-definition \
            --cli-input-json file://new-td.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task_definition=$arn" >> "$GITHUB_OUTPUT"
          echo "registered: $arn"

      - name: Deploy
        run: |
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "devops-g1-${{ matrix.service }}" \
            --task-definition "${{ steps.register.outputs.task_definition }}" \
            --desired-count 2 >/dev/null

          # The service has a deployment circuit breaker with rollback enabled,
          # so a failing rollout reverts on its own; this just waits it out.
          aws ecs wait services-stable \
            --cluster "$CLUSTER" --services "devops-g1-${{ matrix.service }}"

      - name: Post-deploy smoke — assert the running SHA is the built SHA
        id: smoke
        run: |
          api=$(aws apigatewayv2 get-apis \
            --query "Items[?Name=='devops-g1'].ApiEndpoint | [0]" --output text)
          echo "api: $api"

          ok=false
          for i in $(seq 1 12); do
            body=$(curl -fsS --max-time 10 "$api/${{ matrix.service }}/version" 2>/dev/null || echo '{}')
            sha=$(echo "$body" | jq -r '.sha // empty')
            echo "attempt $i: $body"
            if [ "$sha" = "${{ github.sha }}" ]; then ok=true; break; fi
            sleep 10
          done

          if ! $ok; then
            echo "::error::smoke failed — /version did not report ${{ github.sha }}"
            exit 1
          fi
          echo "smoke passed: running ${{ github.sha }}"

      # Belt and braces: the circuit breaker handles a failed rollout, this
      # handles a rollout that succeeded but failed the smoke test.
      - name: Rollback on smoke failure
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          echo "::warning::rolling back to ${{ steps.current.outputs.task_definition }}"
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "devops-g1-${{ matrix.service }}" \
            --task-definition "${{ steps.current.outputs.task_definition }}" >/dev/null
          aws ecs wait services-stable \
            --cluster "$CLUSTER" --services "devops-g1-${{ matrix.service }}"
          echo "rolled back"
          exit 1

      - name: Release summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.service }}"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| task definition | \`${{ steps.register.outputs.task_definition }}\` |"
            echo "| previous | \`${{ steps.current.outputs.task_definition }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
